name: Crear VM en Oracle

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write

concurrency:
  group: crear-vm
  cancel-in-progress: false

jobs:
  intentar:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Instalar la CLI de Oracle
        run: pip install --quiet oci-cli

      - name: Configurar credenciales
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=ocid1.tenancy.oc1..aaaaaaaahh4mc6kabj2nr5wm56lsa4b4ie2jh4qsmdiocawqiwvcqziqgwsq
          region=sa-saopaulo-1
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      # Corridas largas (hasta 85 min, cada pedido a Oracle tarda 1,5–4 min): GitHub atrasa o saltea muchos
      # disparos del cron, así que no conviene depender de corridas cortas. La concurrencia evita que se pisen.
      # Mira el reporte de capacidad cada minuto y pide la VM apenas hay lugar (más un pedido real cada 10 min).
      # "Sin lugar" no marca la corrida como fallida (GitHub mandaría un mail cada vez): solo avisa cuando se crea.
      - name: Intentar crear la VM
        id: crear
        run: |
          timeout 88m ./crear-vm.sh 85 | tee salida.txt || true
          if grep -q -e CREADA -e 'Ya existe' salida.txt; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      - name: Avisar y apagar el reintento
        if: steps.crear.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "VM de Oracle creada" --body "$(cat salida.txt)"
          gh workflow disable reintento.yml

      # GitHub saltea muchos disparos del cron: al terminar sin lugar, la corrida lanza la siguiente
      # (queda en espera por la concurrencia). Cancelar una corrida a mano corta la cadena; el cron la retoma.
      - name: Lanzar la próxima corrida
        if: steps.crear.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reintento.yml --ref main
