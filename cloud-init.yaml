#cloud-config
# Arranque de la VM ARM: deja el addon-stremio corriendo con HTTPS automático.
# crear-vm.sh reemplaza @DEPLOY_B64@ / @DUCKDNS_DOMAIN@ / @DUCKDNS_TOKEN@ antes de lanzar la VM.
# Flujo: abre el firewall -> apunta DuckDNS a esta IP -> instala Docker -> clona el repo privado
#        con el deploy key -> construye y corre el addon -> Caddy le pone TLS (Let's Encrypt).
package_update: true
packages:
  - git
  - ca-certificates
  - curl

write_files:
  - path: /opt/addon/deploy_key.b64
    permissions: '0600'
    content: "@DEPLOY_B64@"
  - path: /opt/addon/duckdns.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      # Apunta el subdominio DuckDNS a la IP pública de esta VM (ip= vacío = DuckDNS usa la IP de origen)
      curl -fsS "https://www.duckdns.org/update?domains=@DUCKDNS_DOMAIN@&token=@DUCKDNS_TOKEN@&ip="
  - path: /opt/addon/Caddyfile
    content: |
      @DUCKDNS_DOMAIN@.duckdns.org {
        reverse_proxy 127.0.0.1:7000
      }
  - path: /etc/systemd/system/duckdns.timer
    content: |
      [Unit]
      Description=Actualizar DuckDNS cada 5 min
      [Timer]
      OnBootSec=60
      OnUnitActiveSec=300
      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/system/duckdns.service
    content: |
      [Unit]
      Description=Actualizar DuckDNS
      [Service]
      Type=oneshot
      ExecStart=/opt/addon/duckdns.sh

runcmd:
  # 1. Firewall de la instancia: Oracle Ubuntu bloquea todo menos SSH. Abrir 80/443.
  #    (En la VCN hay que abrir 80/443 aparte; lo hace setup-vm.sh / la consola.)
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save || true
  # 2. DuckDNS: apuntar el subdominio a esta VM, y dejarlo refrescándose
  - /opt/addon/duckdns.sh
  - systemctl enable --now duckdns.timer
  # 3. Docker
  - curl -fsSL https://get.docker.com | sh
  # 4. Deploy key de solo lectura y clonado del repo privado
  - base64 -d /opt/addon/deploy_key.b64 > /root/.ssh/sniff_deploy && chmod 600 /root/.ssh/sniff_deploy
  - ssh-keyscan github.com >> /root/.ssh/known_hosts
  - GIT_SSH_COMMAND="ssh -i /root/.ssh/sniff_deploy -o StrictHostKeyChecking=no" git clone git@github.com:larvandres/sniff.git /opt/addon/sniff
  # 5. Construir y correr el addon (usa el Dockerfile del repo). Todas las fuentes + proxy.
  #    RAILWAY_PUBLIC_DOMAIN hace que el proxy HLS se sirva por el mismo puerto/dominio y con https.
  - cd /opt/addon/sniff && docker build -t addon .
  #    EXCLUDE_PROVIDERS saca las 4 que solo dan archivos sin Range (no se pueden adelantar).
  - docker run -d --restart always --name addon -p 127.0.0.1:7000:7000 -e HOST=0.0.0.0 -e PORT=7000 -e ALLOW_PROXY=true -e EXCLUDE_PROVIDERS=4khdhub,moviesmod,moviesdrive,uhdmovies -e RAILWAY_PUBLIC_DOMAIN=@DUCKDNS_DOMAIN@.duckdns.org addon
  # 6. Caddy: TLS automático y reverse proxy al addon
  - docker run -d --restart always --name caddy --network host -v /opt/addon/caddy-data:/data -v /opt/addon/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2.8.4
